<!DOCTYPE html>
<html lang="en">
<head>

  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- ─── Fonts ──────────────────────────────────────────────── -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link

  <script type="text/babel" data-presets="react" src="js/app.js"></script>
