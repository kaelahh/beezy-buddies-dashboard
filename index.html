// ═══════════════════════════════════════════════════════════════
// pages/SettingsPage.js
// ═══════════════════════════════════════════════════════════════
function SettingsPage({ navigate, user, pendingCount }) {
  const { state, dispatch } = React.useContext(AppCtx);
  const toast = React.useContext(ToastCtx);
  const rec = state.recovery;
  const [pct_v,    setPct]    = React.useState(rec.percentage);
  const [boxTotal, setBoxTotal] = React.useState(rec.boxes.total);
  const [vehTotal, setVehTotal] = React.useState(rec.vehicle.total);
  const [confirm,  setConfirm]  = React.useState(false);
  const [syncing,  setSyncing]  = React.useState(false);
  const [setting,  setSetting]  = React.useState(false);

  const saveRecovery = () => {
    dispatch({ type: "SET_RECOVERY", payload: {
      percentage: +pct_v,
      boxes:   { ...rec.boxes,   total: +boxTotal },
      vehicle: { ...rec.vehicle, total: +vehTotal },
    }});
    toast("Recovery settings saved! ✅");
  };

  const handleSetupSheets = async () => {
    if (!GAS_URL) { toast("Set GAS_URL first.", "err"); return; }
    setSetting(true);
    const ok = await sheetsAPI.setup();
    setSetting(false);
    toast(ok ? "Sheets initialized! ✅ All tabs created." : "Setup failed. Check your GAS_URL.", ok ? "ok" : "err");
  };

  const handleForceSync = async () => {
    if (!GAS_URL) { toast("Set GAS_URL first.", "err"); return; }
    if (state.pendingSync.length === 0) { toast("Nothing pending — all synced! ✅"); return; }
    setSyncing(true);
    sheetsAPI.syncQueue(state.pendingSync, rem => {
      dispatch({ type: "SET_PENDING", payload: rem });
      setSyncing(false);
      const synced = state.pendingSync.length - rem.length;
      toast(rem.length === 0
        ? `All ${synced} record${synced !== 1 ? "s" : ""} synced! ✅`
        : `Synced ${synced}, ${rem.length} still pending.`,
        rem.length === 0 ? "ok" : "err");
    });
  };

  const resetAll = () => {
    ["bb_sales","bb_expenses","bb_production","bb_pending","bb_recovery","bb_products"]
      .forEach(k => localStorage.removeItem(k));
    window.location.reload();
  };

  return (
    <div className="page">
      <PageHeader title="⚙️ Settings" sub="Configuration & sync" navigate={navigate} user={user} pendingCount={pendingCount} showLogout/>
      <div className="page-body">

        {/* ── Sync Status ── */}
        <div className="card mb-3">
          <div className="card-body">
            <div style={{fontWeight:700,fontSize:15,marginBottom:10}}>🔗 Google Sheets Sync</div>
            <div style={{background:GAS_URL?"var(--g50)":"var(--r100)",borderRadius:10,padding:12,display:"flex",gap:10,alignItems:"center",marginBottom:12}}>
              <span style={{fontSize:22}}>{GAS_URL?"✅":"❌"}</span>
              <div>
                <div style={{fontWeight:700,fontSize:13}}>{GAS_URL?"Sync Enabled":"Not Configured"}</div>
                <div style={{fontSize:12,color:"var(--tx3)",marginTop:2}}>
                  {GAS_URL ? "Every save writes to your Google Sheet." : "Add your GAS_URL near the top of this file to enable sync."}
                </div>
              </div>
            </div>

            {state.pendingSync.length > 0 ? (
              <div style={{background:"var(--y100)",borderRadius:10,padding:12,display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                <div style={{display:"flex",gap:8,alignItems:"center"}}>
                  <Icon name="sync" size={16}/>
                  <div>
                    <div style={{fontWeight:700,fontSize:13}}>{state.pendingSync.length} record{state.pendingSync.length!==1?"s":""} pending sync</div>
                    <div style={{fontSize:11,color:"var(--tx3)",marginTop:1}}>Saved locally, waiting to upload.</div>
                  </div>
                </div>
                <button className="btn btn-accent btn-sm" onClick={handleForceSync} disabled={syncing||!GAS_URL}>
                  {syncing ? <Spinner/> : "Sync Now"}
                </button>
              </div>
            ) : GAS_URL ? (
              <div style={{background:"var(--g50)",borderRadius:10,padding:10,display:"flex",gap:8,alignItems:"center",marginBottom:10}}>
                <Icon name="check" size={16}/><span style={{fontSize:13,fontWeight:600,color:"var(--g700)"}}>All records synced</span>
              </div>
            ) : null}

            {GAS_URL && (
              <button className="btn btn-primary btn-full" onClick={handleSetupSheets} disabled={setting}>
                {setting ? <><Spinner/> Initializing...</> : "🗂️ Initialize / Rebuild All Sheets"}
              </button>
            )}
            <div style={{fontSize:12,color:"var(--tx3)",marginTop:6,textAlign:"center"}}>
              Run this once after first deployment, or to rebuild missing tabs.
            </div>
          </div>
        </div>

        {/* ── Recovery Settings ── */}
        <div className="card mb-3">
          <div className="card-body">
            <div style={{fontWeight:700,fontSize:15,marginBottom:12}}>🔄 Cost Recovery</div>
            <div className="field mb-2">
              <label className="label">Recovery % per sale</label>
              <input className="input" type="number" min="0" max="100" step="0.1" value={pct_v} onChange={e=>setPct(e.target.value)}/>
              <div style={{fontSize:12,color:"var(--tx3)",marginTop:4}}>Applied to every transaction's revenue.</div>
            </div>
            <div className="divider"/>
            <div style={{fontWeight:600,fontSize:13,marginBottom:8,color:"var(--tx2)"}}>Capital Costs to Recover</div>
            <div className="field mb-2">
              <label className="label">📦 Boxes & Display Equipment (₱)</label>
              <input className="input" type="number" min="0" value={boxTotal} onChange={e=>setBoxTotal(e.target.value)}/>
              <div style={{fontSize:12,color:"var(--tx3)",marginTop:4}}>Recovered: {peso(rec.boxes.recovered)} / {peso(+boxTotal)}</div>
            </div>
            <div className="field mb-3">
              <label className="label">🚐 Delivery Vehicle (₱)</label>
              <input className="input" type="number" min="0" value={vehTotal} onChange={e=>setVehTotal(e.target.value)}/>
              <div style={{fontSize:12,color:"var(--tx3)",marginTop:4}}>Recovered: {peso(rec.vehicle.recovered)} / {peso(+vehTotal)}</div>
            </div>
            <button className="btn btn-primary btn-full" onClick={saveRecovery}>Save Recovery Settings</button>
          </div>
        </div>

        {/* ── Setup Guide ── */}
        <div className="card mb-3">
          <div className="card-body">
            <div style={{fontWeight:700,fontSize:15,marginBottom:12}}>📖 Google Sheets Setup Guide</div>
            {[
              ["1","Create a blank Google Sheet","Any name works. You don't need to create tabs — the script does it."],
              ["2","Open Apps Script","Extensions → Apps Script. Delete existing code and paste the GAS script below."],
              ["3","Run manualSetup()","Select manualSetup in the toolbar and click ▶ Run. Approve permissions."],
              ["4","Deploy as Web App","Deploy → New deployment → Web app. Execute as: Me, Access: Anyone. Copy the URL."],
              ["5","Paste GAS_URL","Open this HTML file in a text editor. Find const GAS_URL near the top. Paste the URL."],
              ["6","Initialize Sheets","Re-open the app and tap Initialize / Rebuild All Sheets in Settings."],
            ].map(([n, title, desc]) => (
              <div key={n} style={{display:"flex",gap:12,marginBottom:14}}>
                <div style={{width:26,height:26,borderRadius:"50%",background:"var(--g700)",color:"#fff",fontWeight:800,fontSize:13,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:1}}>{n}</div>
                <div>
                  <div style={{fontWeight:700,fontSize:13,color:"var(--tx1)"}}>{title}</div>
                  <div style={{fontSize:12,color:"var(--tx2)",marginTop:3,lineHeight:1.6}}>{desc}</div>
                </div>
              </div>
            ))}

            {/* GAS script snippet */}
            <div style={{marginTop:4,background:"#1e1e2e",borderRadius:10,padding:12,overflowX:"auto"}}>
              <pre style={{fontSize:10,color:"#cdd6f4",lineHeight:1.6,whiteSpace:"pre-wrap"}}>{`function doPost(e) {
  try {
    const d = JSON.parse(e.postData.contents);
    const ss = SpreadsheetApp.getActiveSpreadsheet();
    if (d.action === 'setup') {
      ['Sales','Expenses','Production'].forEach(name => {
        if (!ss.getSheetByName(name)) ss.insertSheet(name);
      });
    } else {
      const sheet = ss.getSheetByName(d.action.replace('append',''))
        || ss.insertSheet(d.action.replace('append',''));
      sheet.appendRow(Object.values(d.payload));
    }
    return ContentService
      .createTextOutput(JSON.stringify({ok:true}))
      .setMimeType(ContentService.MimeType.JSON);
  } catch(err) {
    return ContentService
      .createTextOutput(JSON.stringify({err:err.message}))
      .setMimeType(ContentService.MimeType.JSON);
  }
}
function manualSetup() {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  ['Sales','Expenses','Production'].forEach(name => {
    if (!ss.getSheetByName(name)) ss.insertSheet(name);
  });
}`}</pre>
            </div>
          </div>
        </div>

        {/* ── Local data stats ── */}
        <div className="card mb-3">
          <div className="card-body">
            <div style={{fontWeight:700,fontSize:14,marginBottom:10}}>📊 Local Data</div>
            <div className="grid-3" style={{gap:8}}>
              {[["🧾","Sales",state.sales.length],["💸","Expenses",state.expenses.length],["🏭","Production",state.production.length]].map(([emoji,label,count])=>(
                <div key={label} style={{background:"var(--g50)",borderRadius:10,padding:10,textAlign:"center"}}>
                  <div style={{fontSize:18}}>{emoji}</div>
                  <div style={{fontWeight:800,fontSize:20,color:"var(--g700)"}}>{count}</div>
                  <div style={{fontSize:11,color:"var(--tx3)",fontWeight:600}}>{label}</div>
                </div>
              ))}
            </div>
          </div>
        </div>

        {/* ── Danger Zone ── */}
        <div className="card" style={{border:"1.5px solid var(--r100)"}}>
          <div className="card-body">
            <div style={{fontWeight:700,fontSize:15,marginBottom:6,color:"var(--r500)"}}>⚠️ Danger Zone</div>
            <div style={{fontSize:13,color:"var(--tx2)",marginBottom:12}}>Permanently deletes all local data. Google Sheets is unaffected.</div>
            <button className="btn btn-danger btn-full" onClick={()=>setConfirm(true)}>Reset All Local Data</button>
          </div>
        </div>

      </div>
      <ConfirmModal open={confirm} msg="Delete ALL local data? This cannot be undone. Google Sheets won't be affected." onConfirm={resetAll} onCancel={()=>setConfirm(false)}/>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// app.js — AppRouter + App root + render
// ═══════════════════════════════════════════════════════════════

// FIX 6: AppRouter is now a pure router — it no longer owns AppProvider.
// Previously AppProvider was INSIDE renderContent(), which meant it
// re-mounted on every route change, destroying all state, firing all
// useEffects (including Supabase subscriptions) on every navigation,
// and causing the blank screen after the first route transition.
// AppProvider and ToastProvider now live in App, wrapping everything once.
function AppRouter() {
  const { user } = React.useContext(AuthCtx);
  const [route, navigate] = useHash();

  React.useEffect(() => {
    if (!user) {
      if (route !== "/login") navigate("/login");
      return;
    }
    const allowed = user.role === "cashier" ? CASHIER_ROUTES : ADMIN_ROUTES;
    if (route === "/" || route === "/login" || !allowed.includes(route)) {
      navigate(user.role === "cashier" ? "/sales" : "/dashboard");
    }
  }, [user, route]);

  const renderContent = () => {
    if (!user || route === "/login" || route === "/") {
      return <LoginPage navigate={navigate}/>;
    }
    const allowed = user.role === "cashier" ? CASHIER_ROUTES : ADMIN_ROUTES;
    if (!allowed.includes(route)) return <LoginPage navigate={navigate}/>;

    const pageMap = {
      "/sales":      <SalesPage/>,
      "/cash-count": <CashCountPage/>,
      "/expenses":   <ExpensesPage/>,
      "/production": <ProductionPage/>,
      "/products":   <ProductsPage/>,
      "/dashboard":  <DashboardPage/>,
      "/settings":   <SettingsPage/>,
    };
    return (
      <Layout route={route} navigate={navigate}>
        {pageMap[route] || <DashboardPage/>}
      </Layout>
    );
  };

  return renderContent();
}

function App() {
  return (
    <AuthProvider>
      {/* FIX 6: AppProvider and ToastProvider live here — above the router —
          so they mount ONCE for the app lifetime. Realtime subscriptions and
          state are preserved across all route changes. */}
      <AppProvider>
        <ToastProvider>
          <AppRouter/>
        </ToastProvider>
      </AppProvider>
    </AuthProvider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
